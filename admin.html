<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Umi Ranis</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;font-family:Arial,sans-serif;
    background:#fffaf0;color:#24352b
}
header{
    background:#217a4a;color:white;
    padding:22px;text-align:center
}
header h1{margin:0}
.container{max-width:900px;margin:25px auto;padding:15px}
.card{
    background:white;padding:20px;margin-bottom:20px;
    border-radius:16px;border:1px solid #e5e9df
}
input,select,button{
    width:100%;padding:12px;margin:6px 0;
    border-radius:9px;border:1px solid #ddd;font-size:15px
}
button{
    background:#217a4a;color:white;border:none;
    cursor:pointer;font-weight:bold
}
button:hover{opacity:.9}
.delete{background:#d94b43}
.cancel{background:#68776c}
.logout{background:#42534a}
.product{
    border-bottom:1px solid #eee;padding:16px 0;
    display:flex;gap:15px;align-items:flex-start
}
.product img{
    width:95px;height:95px;object-fit:cover;
    border-radius:12px;background:#e5f5df
}
.product-info{flex:1;min-width:0}
.price{color:#217a4a;font-weight:bold}
label{
    display:block;font-weight:bold;margin-top:12px;font-size:14px
}
.hint{font-size:12px;color:#68776c;line-height:1.5}
#status{
    padding:12px;border-radius:8px;
    background:#f2f5ed;white-space:pre-wrap
}
.back{
    display:block;text-align:center;color:#217a4a;
    margin:20px;text-decoration:none
}
@media(max-width:500px){
    .product img{width:75px;height:75px}
    .card{padding:14px}
}
</style>
</head>

<body>

<header>
    <h1>🛒 Umi Ranis</h1>
    <p>Dashboard Pengelolaan Produk</p>
</header>

<div class="container">

    <div class="card">
        <h2>🔐 Status Admin</h2>
        <p id="status">Memeriksa login...</p>
        <button type="button" class="logout" id="logoutButton">
            Keluar dari Akun
        </button>
    </div>

    <div class="card" id="adminPanel" hidden>
        <h2 id="formTitle">➕ Tambah Produk</h2>

        <form id="productForm">
            <label>Nama Produk</label>
            <input id="name" required maxlength="150"
                   placeholder="Contoh: Minyak Goreng 1 L">

            <label>Kategori</label>
            <select id="category" required>
                <option value="Sembako">🌾 Sembako</option>
                <option value="Makanan">🍜 Makanan</option>
                <option value="Minuman">🥤 Minuman</option>
                <option value="Rumah tangga">🧼 Rumah tangga</option>
            </select>

            <label>Harga Jual (Rp)</label>
            <input id="price" type="number" min="1" step="1" required>

            <label>Jumlah Stok</label>
            <input id="stock" type="number" min="0" step="1" required>

            <label>Satuan</label>
            <input id="unit" maxlength="30" placeholder="Contoh: pcs, kg, liter">

            <label>Emoji Produk</label>
            <input id="emoji" maxlength="20" placeholder="Contoh: 🛍️">

            <label>Warna Latar</label>
            <input id="color" type="color" value="#e5f5df">

            <label>URL Foto Produk</label>
            <input id="photoUrl" type="url"
                   placeholder="https://contoh.com/foto.jpg">

            <p class="hint">
                Masukkan URL foto yang bisa diakses melalui browser.
                Fitur ini menggunakan URL foto, bukan upload langsung.
            </p>

            <img id="preview" alt="Pratinjau foto"
                 style="display:none;width:120px;height:120px;object-fit:contain">

            <button type="submit" id="saveButton">
                💾 Simpan Produk
            </button>

            <button type="button" id="cancelButton"
                    class="cancel" hidden>
                Batal Edit
            </button>
        </form>
    </div>

    <div class="card" id="listPanel" hidden>
        <h2>📦 Daftar Produk</h2>
        <button type="button" id="refreshButton">
            🔄 Muat Ulang Produk
        </button>
        <div id="productList">Memuat produk...</div>
    </div>

    <a class="back" href="index.html">← Kembali ke Katalog</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://clhgnfvmizqasbchgwuz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eddkt0LLFQjn3n4OW11E6g_TtefNfON';

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const statusBox = document.getElementById('status');
const adminPanel = document.getElementById('adminPanel');
const listPanel = document.getElementById('listPanel');
const form = document.getElementById('productForm');
const productList = document.getElementById('productList');

let editingId = null;
let products = [];
let busy = false;

function message(text) {
    statusBox.textContent = text;
}

function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    })[char]);
}

// Periksa sesi login dan status admin.
async function checkAdmin() {
    adminPanel.hidden = true;
    listPanel.hidden = true;

    const { data, error } = await db.auth.getSession();

    if (error || !data.session) {
        message('Belum login. Silakan kembali ke katalog dan login sebagai admin.');
        return false;
    }

    const user = data.session.user;

    const { data: admin, error: adminError } = await db
        .from('admin_users')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

    if (adminError) {
        message('Gagal memeriksa hak admin: ' + adminError.message);
        return false;
    }

    if (!admin) {
        message('Akun ini tidak terdaftar sebagai admin.');
        return false;
    }

    message('Login berhasil. Hak akses admin terverifikasi.');
    adminPanel.hidden = false;
    listPanel.hidden = false;

    await loadProducts();
    return true;
}

// Ambil produk dari database Supabase.
async function loadProducts() {
    productList.textContent = 'Memuat produk...';

    const { data, error } = await db
        .from('Produk')
        .select('id,name,category,price,stock,unit,emoji,color,photo_url')
        .order('id', { ascending: true });

    if (error) {
        productList.textContent = 'Gagal memuat produk: ' + error.message;
        return;
    }

    products = data || [];
    renderProducts();
}

function renderProducts() {
    if (!products.length) {
        productList.textContent = 'Belum ada produk di database.';
        return;
    }

    productList.innerHTML = products.map(p => {
        const image = p.photo_url || '';
        const imageHTML = image
            ? `<img src="${escapeHTML(image)}"
                    alt="${escapeHTML(p.name)}"
                    onerror="this.style.display='none'">`
            : `<div style="width:95px;height:95px;border-radius:12px;
                         background:${escapeHTML(p.color || '#e5f5df')};
                         display:grid;place-items:center;font-size:32px">
                    ${escapeHTML(p.emoji || '🛍️')}
               </div>`;

        return `
        <div class="product">
            ${imageHTML}
            <div class="product-info">
                <strong>${escapeHTML(p.name)}</strong>
                <p>${escapeHTML(p.category)}</p>
                <p class="price">Rp${Number(p.price).toLocaleString('id-ID')}</p>
                <p>Stok: ${Number(p.stock)} ${escapeHTML(p.unit || '')}</p>
                <button type="button" data-edit="${escapeHTML(p.id)}">✏️ Edit</button>
                <button type="button" class="delete"
                        data-delete="${escapeHTML(p.id)}">🗑️ Hapus</button>
            </div>
        </div>`;
    }).join('');
}

function resetForm() {
    form.reset();
    editingId = null;

    document.getElementById('color').value = '#e5f5df';
    document.getElementById('formTitle').textContent = '➕ Tambah Produk';
    document.getElementById('saveButton').textContent = '💾 Simpan Produk';
    document.getElementById('cancelButton').hidden = true;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('preview').removeAttribute('src');
}

document.getElementById('photoUrl').addEventListener('input', () => {
    const url = document.getElementById('photoUrl').value.trim();
    const preview = document.getElementById('preview');

    if (!url) {
        preview.style.display = 'none';
        return;
    }

    try {
        const parsed = new URL(url);

        if (!['http:', 'https:'].includes(parsed.protocol)) {
            preview.style.display = 'none';
            return;
        }

        preview.src = url;
        preview.style.display = 'block';
    } catch {
        preview.style.display = 'none';
    }
});

// Tambah atau edit produk di Supabase.
form.addEventListener('submit', async event => {
    event.preventDefault();

    if (busy) return;
    busy = true;

    const button = document.getElementById('saveButton');
    button.disabled = true;

    try {
        const name = document.getElementById('name').value.trim();
        const category = document.getElementById('category').value;
        const price = Number(document.getElementById('price').value);
        const stock = Number(document.getElementById('stock').value);
        const unit = document.getElementById('unit').value.trim();
        const emoji = document.getElementById('emoji').value.trim() || '🛍️';
        const color = document.getElementById('color').value;
        const photo_url = document.getElementById('photoUrl').value.trim();

        if (!name || !Number.isFinite(price) || price <= 0 ||
            !Number.isInteger(stock) || stock < 0) {
            alert('Periksa kembali nama, harga, dan stok.');
            return;
        }

        if (photo_url) {
            const parsed = new URL(photo_url);
            if (!['http:', 'https:'].includes(parsed.protocol)) {
                alert('URL foto harus menggunakan HTTP atau HTTPS.');
                return;
            }
        }

        const payload = {
            name, category, price, stock, unit, emoji, color, photo_url
        };

        let result;

        if (editingId !== null) {
            result = await db
                .from('Produk')
                .update(payload)
                .eq('id', editingId)
                .select();
        } else {
            result = await db
                .from('Produk')
                .insert(payload)
                .select();
        }

        if (result.error) {
            alert('Gagal menyimpan produk:\n' + result.error.message);
            return;
        }

        if (!result.data || result.data.length === 0) {
            alert('Tidak ada perubahan yang dikonfirmasi database. Periksa izin tabel Produk.');
            return;
        }

        alert(editingId !== null
            ? 'Produk berhasil diperbarui!'
            : 'Produk berhasil ditambahkan!');

        resetForm();
        await loadProducts();

    } catch (error) {
        alert('Terjadi kesalahan: ' + error.message);
    } finally {
        busy = false;
        button.disabled = false;
    }
});

// Tombol edit dan hapus.
productList.addEventListener('click', async event => {
    const editButton = event.target.closest('[data-edit]');
    const deleteButton = event.target.closest('[data-delete]');

    if (editButton) {
        const p = products.find(item =>
            String(item.id) === editButton.dataset.edit
        );

        if (!p) return;

        editingId = p.id;

        document.getElementById('name').value = p.name || '';
        document.getElementById('category').value = p.category || 'Sembako';
        document.getElementById('price').value = p.price ?? '';
        document.getElementById('stock').value = p.stock ?? 0;
        document.getElementById('unit').value = p.unit || '';
        document.getElementById('emoji').value = p.emoji || '';
        document.getElementById('color').value = p.color || '#e5f5df';
        document.getElementById('photoUrl').value = p.photo_url || '';

        document.getElementById('formTitle').textContent = '✏️ Edit Produk';
        document.getElementById('saveButton').textContent = '💾 Simpan Perubahan';
        document.getElementById('cancelButton').hidden = false;

        document.getElementById('photoUrl').dispatchEvent(new Event('input'));
        form.scrollIntoView({ behavior: 'smooth' });
        return;
    }

    if (deleteButton) {
        const id = deleteButton.dataset.delete;
        const p = products.find(item => String(item.id) === id);

        if (!p || !confirm(`Yakin ingin menghapus "${p.name}"?`)) return;

        const { error } = await db
            .from('Produk')
            .delete()
            .eq('id', p.id)
            .select();

        if (error) {
            alert('Gagal menghapus produk:\n' + error.message);
            return;
        }

        alert('Permintaan hapus selesai. Muat ulang daftar untuk memeriksa hasilnya.');
        await loadProducts();
    }
});

document.getElementById('cancelButton').addEventListener('click', resetForm);
document.getElementById('refreshButton').addEventListener('click', loadProducts);

document.getElementById('logoutButton').addEventListener('click', async () => {
    const { error } = await db.auth.signOut();

    if (error) {
        alert('Gagal keluar: ' + error.message);
        return;
    }

    window.location.href = 'index.html';
});

checkAdmin();
</script>

</body>
</html>
