<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Warung Umi Ranis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #fffaf0;
            color: #24352b;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 {
            margin-top: 0;
            color: #217a4a;
            text-align: center;
        }

        p {
            text-align: center;
            color: #647067;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            border: 1px solid #ccd5cd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #217a4a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #message {
            margin-top: 16px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #217a4a;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="login-box">
        <h1>🌿 Umi Ranis</h1>
        <p>Login khusus administrator</p>

        <form id="loginForm">
            <label for="email">Email admin</label>
            <input
                type="email"
                id="email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Login
            </button>
        </form>

        <div id="message" role="status"></div>

        <a class="back" href="index.html">
            ← Kembali ke katalog
        </a>
    </main>

    <script type="module">
        import { createClient } from
            "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL =
            "https://clhgnfvmizqasbchgwuz.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_eddkt0LLFQjn3n4OW11E6g_TtefNfON";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Memeriksa...";
            message.textContent = "Sedang memeriksa akun...";

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            try {
                const { data, error } =
                    await supabase.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) {
    throw error;
}

// Periksa apakah akun terdaftar sebagai admin
const { data: adminData, error: adminError } =
    await supabase
        .from("admin_users")
        .select("user_id")
        .eq("user_id", data.user.id)
        .maybeSingle();

if (adminError) {
    throw new Error(
        "Gagal memeriksa akses admin: " +
        adminError.message
    );
}

if (!adminData) {
    await supabase.auth.signOut();

    throw new Error(
        "Akun ini tidak memiliki akses administrator."
    );
}

// Login berhasil dan akun terdaftar sebagai admin
message.textContent =
    "Login berhasil! Akun administrator terverifikasi.";

            } catch (error) {
                message.textContent =
                    "Login gagal: " + error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>
</body>
</html>
